<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steuerfuchs</title>
<link rel="icon" href="/static/icon-256.png" type="image/png">
<script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=t||'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
<script src="/static/htmx.min.js?v=__VERSION__"></script>
<style>
/* Design-Tokens. Dark ist Standard, Light über den Toggle. */
:root,:root[data-theme="dark"]{
  --bg:#0e0e13;--bg2:#15151c;--card:#1a1a22;--card2:#20202a;--fg:#f4f4f6;--muted:#9c9cad;--line:#262630;
  --orange:#ff6a1f;--orange-hell:rgba(255,106,31,.14);--gruen:#22c55e;--gruen-hell:rgba(34,197,94,.14);
  --rot:#ef4444;--rot-hell:rgba(239,68,68,.14);--gelb:#facc15;--gelb-hell:rgba(250,204,21,.14);--blau:#60a5fa;--blau-hell:rgba(96,165,250,.14);
  --knopf-fg:#ffffff;--schatten:0 8px 30px rgba(0,0,0,.35);--vorschau-bg:#ffffff;color-scheme:dark
}
:root[data-theme="light"]{
  --bg:#f3f4f8;--bg2:#e9eaf0;--card:#ffffff;--card2:#f6f7fa;--fg:#14141b;--muted:#5f5f72;--line:#e2e3ea;
  --orange:#ff6a1f;--orange-hell:rgba(255,106,31,.12);--gruen:#16a34a;--gruen-hell:rgba(22,163,74,.12);
  --rot:#dc2626;--rot-hell:rgba(220,38,38,.10);--gelb:#ca8a04;--gelb-hell:rgba(202,138,4,.14);--blau:#2563eb;--blau-hell:rgba(37,99,235,.12);
  --knopf-fg:#ffffff;--schatten:0 8px 24px rgba(20,20,40,.08);--vorschau-bg:#ffffff;color-scheme:light
}
/* Semantische Aliase auf die vorhandenen Tokens */
:root{--text:var(--fg);--text-muted:var(--muted);--border:var(--line);--surface-2:var(--card2);--accent:var(--orange);--warn:var(--gelb)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Outfit","Avenir Next","Plus Jakarta Sans","Segoe UI Variable",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"side top" "side main";min-height:100vh}
@media (max-width:900px){body{grid-template-columns:72px 1fr}.side .txt,.side .logo-txt,.side .user-txt{display:none}.side nav button{justify-content:center;padding:.7rem 0}}
/* Sidebar */
.side{grid-area:side;align-self:start;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.2rem .9rem;gap:1.2rem;position:sticky;top:0;height:100vh}
.logo{padding:.3rem .2rem .2rem}
.logo .wortmarke{width:100%;height:auto;display:block;color:var(--fg)} .logo .wm{fill:currentColor}
.logo .mark{width:44px;height:44px;border-radius:12px;background:var(--orange);display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2rem;box-shadow:0 6px 18px rgba(255,106,31,.35);flex:none}
.logo-txt b{display:block;font-size:1.15rem;letter-spacing:.01em;line-height:1.1}
.logo-txt small{color:var(--orange);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.side nav{display:flex;flex-direction:column;gap:.25rem}
.side nav button{box-shadow:none;display:flex;align-items:center;gap:.8rem;width:100%;background:transparent;border:0;border-left:3px solid transparent;color:var(--muted);padding:.7rem .8rem;border-radius:10px;cursor:pointer;font:inherit;font-size:.98rem;text-align:left;font-weight:500}
.side nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side nav button:hover{background:var(--card);color:var(--fg)}
.side nav button.aktiv{background:linear-gradient(90deg,var(--orange-hell),transparent);color:var(--fg);border-left-color:var(--orange)}
.side nav button.aktiv svg{color:var(--orange)}
.side nav button{justify-content:space-between}
.side nav button .txt{flex:1}
.side nav button .z{margin-left:auto;min-width:1.5em;padding:1px 7px;border-radius:999px;background:var(--orange);color:#fff;font-size:12px;line-height:1.3;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.side nav button .z.warn{background:var(--gelb-hell);color:var(--gelb)}
.side nav button .z.text{background:var(--card2);color:var(--muted);font-weight:600}
.side nav button .z.text.fertig{background:var(--gruen-hell);color:var(--gruen)}
.side nav button .z:empty{display:none}
.side .unten{margin-top:auto;display:flex;flex-direction:column;gap:.6rem}
.user{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem}
.user .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#ffb066);display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.user-txt b{display:block;font-size:.95rem}
.user-txt .rolle{display:inline-block;background:var(--orange);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.08em;padding:.1em .5em;border-radius:4px;margin-top:.2rem}
#theme-toggle{box-shadow:none;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:.5rem .7rem;cursor:pointer;font:inherit;font-size:.85rem;display:flex;align-items:center;gap:.5rem;justify-content:center}
#theme-toggle:hover{color:var(--fg);border-color:var(--orange)}
/* Topbar */
.top{grid-area:top;display:flex;align-items:center;gap:1rem;padding:1.3rem 2rem .9rem;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
.top .rechts{margin-left:auto;display:flex;gap:.6rem;align-items:center}
main{grid-area:main;padding:24px 2rem 3rem;max-width:1500px;width:100%}
main > section > :first-child{margin-top:0}
.top .jahr-wahl{flex-direction:row;align-items:center;gap:.4rem;font-size:.9em;color:var(--muted)} .top .jahr-wahl select{padding:.3rem .5rem;font-weight:600;color:var(--fg)}
.ki-badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.85em;color:var(--muted);text-decoration:none;padding:.3rem .6rem;border-radius:999px;border:1px solid transparent}
.ki-badge:hover{border-color:var(--line)}
.ki-badge .punkt{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.ki-badge.aktiv .punkt{background:var(--gruen)} .ki-badge.nicht_erreichbar{color:var(--gelb)} .ki-badge.nicht_erreichbar .punkt{background:var(--gelb)}
.zusicherung{font-size:.8em;color:var(--muted)}
.erkl{font-size:14px;margin:.2rem 0 .8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
hr.trenner{border:0;border-top:1px solid var(--line);margin:1.6rem 0 1rem}
.num.leer{color:var(--muted)}
h2{font-size:1.3rem;margin:.2rem 0 .8rem;font-weight:700} h2 select{margin-left:.4rem}
h3{font-size:1.05rem;margin:1.6rem 0 .5rem;font-weight:700}
h4{margin:.2rem 0 .4rem}
.muted{color:var(--muted)} .klein{font-size:.85em} .fett{font-weight:700} .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--rot)} .pos{color:var(--gruen)}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.5rem 0} .row.zwischen{justify-content:space-between}
.inline{display:inline-flex;gap:.3rem;align-items:center;margin:0}
button,.button,.btn-primary{background:var(--orange);color:var(--knopf-fg);border:0;border-radius:10px;padding:.55rem 1.1rem;font:inherit;font-weight:700;letter-spacing:.02em;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:none;transition:transform .05s,background .15s}
button:hover,.button:hover{filter:brightness(1.08)} button:active{transform:translateY(1px)}
.btn-secondary,button.btn-secondary,.button.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:600;filter:none}
.btn-secondary:hover,button.btn-secondary:hover{background:var(--surface-2);filter:none}
.btn-ghost,button.btn-ghost,a.btn-ghost{background:transparent;color:var(--text-muted);border:0;padding:.35rem .5rem;font-weight:500;text-decoration:none;box-shadow:none}
.btn-ghost:hover,button.btn-ghost:hover,a.btn-ghost:hover{text-decoration:underline;background:transparent;color:var(--text);filter:none}
button.sekundaer,.button.sekundaer{background:var(--card2);color:var(--fg);border:1px solid var(--line);box-shadow:none;font-weight:500}
button.sekundaer:hover{border-color:var(--orange)}
button.gefahr{background:transparent;color:var(--rot);border:1px solid var(--rot);box-shadow:none;font-weight:500} button.gefahr:hover{background:var(--rot-hell)}
button.klein,.button.klein{padding:.25rem .65rem;font-size:.85em;border-radius:8px}
button:disabled{opacity:.5}
input,select{font:inherit;padding:.5rem .65rem;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--fg);max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-hell)}
input[type=number]{text-align:right}
input[type=checkbox]{accent-color:var(--orange)}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.85em;color:var(--muted)} label input,label select{color:var(--fg)}
label.check{flex-direction:row;align-items:center;gap:.5rem;color:var(--fg);font-size:.95em}
.link{color:var(--orange);cursor:pointer;text-decoration:underline}
a{color:var(--orange)}
.tabelle{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabelle th,.tabelle td{padding:.6rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tabelle tr:last-child td{border-bottom:0}
.tabelle th{background:var(--card2);color:var(--muted);font-weight:600;font-size:.78em;text-transform:uppercase;letter-spacing:.06em}
.tabelle.kompakt th,.tabelle.kompakt td{padding:.4rem .6rem}
.tabelle tbody tr:hover td{background:var(--card2)}
.tabelle tfoot td{background:var(--card2);border-top:1px solid var(--line)} tr.summe td{font-weight:600} tr.einnahme td:first-child{color:var(--gruen)}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:8px;font-size:.76em;font-weight:600;border:1px solid var(--line);background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--gruen-hell);color:var(--gruen);border-color:transparent}
.badge.mid{background:var(--gelb-hell);color:var(--gelb);border-color:transparent}
.badge.low{background:var(--rot-hell);color:var(--rot);border-color:transparent}
.badge.rc{background:var(--orange-hell);color:var(--orange);border-color:transparent}
.badge.stufe{background:var(--blau-hell);color:var(--blau);border-color:transparent}
.dropzonen{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:.8rem 0}
@media (max-width:900px){.dropzonen{grid-template-columns:1fr}}
.dropzone{border:2px dashed var(--line);border-radius:16px;padding:2rem 1.5rem;text-align:center;background:var(--card);transition:border-color .15s,background .15s,box-shadow .15s}
.dropzone strong{font-size:1.15rem;display:block;margin:.2rem 0}
.dropzone .dz-icon{width:44px;height:44px;border-radius:12px;margin:0 auto .6rem;display:grid;place-items:center;color:#fff}
.dropzone .dz-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.dropzone.minus-zone .dz-icon{background:var(--rot)} .dropzone.plus-zone .dz-icon{background:var(--gruen)}
.dropzone.minus-zone.aktiv,.dropzone.minus-zone:hover{border-color:var(--rot);background:var(--rot-hell)}
.dropzone.plus-zone.aktiv,.dropzone.plus-zone:hover{border-color:var(--gruen);background:var(--gruen-hell)}
/* Aktions-Buttons: Icon immer davor, Hover immer Vollfarbe mit weißer Schrift */
button svg,.button svg{width:1.05em;height:1.05em;vertical-align:-.15em;margin-right:.4em;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
button kbd{margin-left:.3em;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:inherit}
button.gruen{background:var(--gruen);color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.25)} button.gruen:hover{box-shadow:0 0 0 3px var(--gruen-hell),0 8px 26px rgba(34,197,94,.55)}
button.outline-gelb,button.outline-orange,button.outline-rot{background:transparent;box-shadow:none;font-weight:600;border:1.5px solid}
button.outline-gelb{color:var(--gelb);border-color:var(--gelb)} button.outline-gelb:hover{background:var(--gelb);color:#fff;box-shadow:0 6px 18px rgba(250,204,21,.35)}
button.outline-orange{color:var(--orange);border-color:var(--orange)} button.outline-orange:hover{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(255,106,31,.4)}
button.outline-rot{color:var(--rot);border-color:var(--rot)} button.outline-rot:hover{background:var(--rot);color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.4)}
button.outline-gelb kbd,button.outline-orange kbd,button.outline-rot kbd{border-color:currentColor;background:transparent}
button:disabled:hover{background:transparent;color:inherit;box-shadow:none}
/* Reiter Einnahmen | Ausgaben */
.tabs.reiter{margin:.2rem 0 .6rem;width:100%} .tabs.reiter button{flex:1;display:flex;justify-content:center;align-items:center;gap:.4rem}
.tabs.reiter button .z{min-width:1.5em;padding:.05em .45em;border-radius:9px;font-size:.75em;background:var(--card);color:var(--muted)}
.tabs.reiter button.aktiv .z{background:rgba(255,255,255,.25);color:#fff}
.tabs.reiter button.minus-tab.aktiv{background:var(--rot);box-shadow:0 4px 12px rgba(239,68,68,.35)} .tabs.reiter button.plus-tab.aktiv{background:var(--gruen);box-shadow:0 4px 12px rgba(34,197,94,.35)}
.karte{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.3rem;margin:.9rem 0;box-shadow:var(--schatten)}
.karten{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.9rem}
/* Alerts: Erfolg grün ✓, Warnung gelb !, Fehler rot ! – Icon immer dabei, nie Farbe allein */
.ok-box,.warn-box,.fehler-box{display:flex;align-items:flex-start;gap:.7rem;padding:.7rem 1rem;border-radius:10px;border-left:4px solid;margin:.6rem 0}
.ok-box::before,.warn-box::before,.fehler-box::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85em;color:#fff;margin-top:.05em}
.ok-box{background:var(--gruen-hell);border-color:var(--gruen)} .ok-box::before{content:"✓";background:var(--gruen)}
.warn-box{background:var(--gelb-hell);border-color:var(--gelb)} .warn-box::before{background:var(--gelb);color:#1a1a22}
.fehler-box{background:var(--rot-hell);border-color:var(--rot)} .fehler-box::before{background:var(--rot)}
/* Kennzahlen-Kacheln */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;margin:.6rem 0 1.2rem}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.2rem;box-shadow:var(--schatten)}
.kpi .l{color:var(--muted);font-size:.85em;margin-bottom:.3rem}
.kpi .w{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.gruen .w{color:var(--gruen)} .kpi.rot .w{color:var(--rot)} .kpi.gelb .w{color:var(--gelb)}
.ring{display:flex;align-items:center;gap:.9rem}
.ring .kreis{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:conic-gradient(var(--gruen) calc(var(--p)*1%),var(--line) 0);flex:none}
.ring .kreis span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.tabs{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.25rem;gap:.2rem}
.tabs button{background:transparent;color:var(--muted);border:0;border-radius:9px;box-shadow:none;font-weight:600;padding:.45rem .9rem}
.tabs button.aktiv{background:var(--orange);color:#fff}
.tabs button.leer:not(.aktiv){color:var(--muted);opacity:.6}
.pruefen{display:grid;grid-template-columns:270px 1fr 1fr;gap:1.1rem;align-items:start}
@media (max-width:1200px){.pruefen{grid-template-columns:1fr}.vorschau{min-height:50vh}}
.pruefen aside{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto}
.pruefen .vorschau-spalte{position:sticky;top:1rem}
.pruefen .vorschau{height:calc(100vh - 7.5rem)}
.formular-kopf{position:sticky;top:0;z-index:4;background:var(--card);margin:-1.2rem -1.3rem 1rem;padding:1rem 1.3rem .8rem;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0}
.formular-kopf h2{margin:0;font-size:1.25rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.formular-kopf .aktionen-raster{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.7rem 0 0}
.formular-kopf .aktionen-raster button{padding:.4rem .5rem;font-size:.86em;font-weight:600;letter-spacing:0;justify-self:stretch;text-align:center;white-space:nowrap}
.kopf-beschreibung{display:flex;align-items:center;gap:.4rem;margin-top:.35rem;font-size:.95em}
.kopf-beschreibung .txt{cursor:text} .kopf-beschreibung .txt.leer{color:var(--muted);font-style:italic}
.kopf-beschreibung .stift{background:transparent;border:0;padding:.15rem;color:var(--muted);box-shadow:none;line-height:0} .kopf-beschreibung .stift:hover{color:var(--orange);filter:none}
.kopf-beschreibung .stift svg{margin:0;width:1em;height:1em}
.kopf-beschreibung input{flex:1;padding:.3rem .5rem}
.formular-kopf .aktionen-raster button.gruen{box-shadow:none}
.formular-kopf .aktionen-raster button.outline-gelb,.formular-kopf .aktionen-raster button.outline-orange,.formular-kopf .aktionen-raster button.outline-rot{color:var(--fg)}
.formular-kopf .aktionen-raster button svg{color:#fff}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem}
.liste li{display:flex;align-items:center;gap:.45rem} .liste li input[type=checkbox]{flex:none;width:16px;height:16px;margin:0}
.liste li a{display:block;flex:1;min-width:0;padding:.55rem .7rem;border-radius:12px;color:var(--fg);text-decoration:none;font-size:.86em;border:1px solid var(--line);background:var(--card)}
.listen-leiste{margin:.2rem 0 .5rem;padding:0 .1rem}
.liste li a:hover{border-color:var(--orange)} .liste li.aktiv a{border-color:var(--orange);background:var(--orange-hell)}
.vorschau{width:100%;height:78vh;border:1px solid var(--line);border-radius:16px;background:var(--vorschau-bg);object-fit:contain}
pre.vorschau{overflow:auto;padding:.8rem;font-size:.8em;background:var(--card);color:var(--fg)}
.vorschau-spalte,.formular-spalte{min-width:0}
.formular{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem;box-shadow:var(--schatten)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem .9rem} .grid2 .breit{grid-column:1/-1}
fieldset.sonderfall{border:1px solid var(--line);border-radius:12px;margin:.9rem 0 0;padding:.6rem .9rem .8rem;display:flex;gap:.9rem;flex-wrap:wrap;align-items:end;background:var(--card2)}
fieldset legend{color:var(--orange);font-size:.82em;font-weight:600;padding:0 .4rem}
.hinweise{margin:.9rem 0 0;padding-left:1.2rem;font-size:.9em} .hinweise li{margin:.2rem 0} .hinweise .warn{color:var(--gelb)}
.aktionen{margin-top:1.1rem}
.aktionen-zelle{white-space:nowrap}
/* Offene Punkte */
.sektion{margin:.9rem 0 1.4rem} .sektion.leer{padding:.55rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:.5rem 0;font-size:.95em}
.sektion h3{margin:.4rem 0}
.auswahl-leiste[hidden]{display:none} .auswahl-leiste{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;margin:.3rem 0 .5rem;border:1px solid var(--orange);border-radius:10px;background:var(--orange-hell);font-size:.9em}
.auswahl-leiste .anzahl{font-weight:600}
/* Jahresabschluss */
.fortschritt-leiste{position:sticky;top:0;z-index:3;background:var(--bg);padding:.4rem 0 .6rem;margin:-4px 0 .6rem}
.fortschritt-leiste .balken{height:4px;background:var(--line);border-radius:2px;margin-top:.4rem;overflow:hidden} .fortschritt-leiste .fuellung{height:100%;background:var(--gruen);transition:width .2s}
details.frage{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:.4rem 0;padding:0}
details.frage summary{list-style:none;display:flex;align-items:center;gap:.7rem;padding:.55rem .9rem;cursor:pointer;min-height:44px}
details.frage summary::-webkit-details-marker{display:none}
details.frage summary .fragetext{flex:1}
details.frage summary .rechts{display:inline-flex;align-items:center;gap:.8rem;white-space:nowrap}
details.frage .erfassen{padding:.2rem .9rem .8rem;border-top:1px solid var(--line);margin:0}
details.frage.erledigt .fragetext{color:var(--muted)}
details.frage[open] summary .btn-ghost{text-decoration:underline}
/* Export */
.eur-tabelle tr.summe td{border-top:1px solid var(--border)} .eur-tabelle tr.fett td{font-weight:700}
.eur-tabelle td:last-child,.eur-tabelle th:last-child{width:11em}
.leer-hinweis{padding:2rem;text-align:center;color:var(--muted)}
/* Abgleich */
.badge.plus-b{background:var(--gruen-hell);color:var(--gruen);border-color:transparent} .badge.minus-b{background:var(--card2);color:var(--muted)}
.abgleich .tabs.reiter{width:auto;margin:.4rem 0} .abgleich .tabs.reiter button{flex:none;padding:.4rem .9rem}
.abgleich tr.doppelt td{background:var(--rot-hell)}
.abgleich-tabelle td:nth-child(5){max-width:30em} .abgleich-tabelle td:nth-child(6){min-width:12em}
.abgleich-tabelle .aktionen-zelle,.abgleich-tabelle .aktion-kopf{white-space:nowrap;width:1%}
.abgleich-tabelle .aktionen-zelle{display:flex;gap:.35rem;align-items:center;flex-wrap:nowrap}
.abgleich-tabelle .aktionen-zelle form{display:inline}
.klebe-leiste{position:sticky;top:0;z-index:4;background:var(--bg);padding:.3rem 0 .4rem;margin-bottom:.3rem}
.klebe-leiste .row{margin:.2rem 0}
/* Nach oben */
#nach-oben{position:fixed;right:1.4rem;bottom:1.4rem;z-index:20;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--card);color:var(--fg);border:1px solid var(--line);box-shadow:var(--schatten);opacity:0;pointer-events:none;transition:opacity .2s}
#nach-oben.sichtbar{opacity:1;pointer-events:auto} #nach-oben:hover{border-color:var(--orange);color:var(--orange);filter:none}
#nach-oben svg{margin:0;width:20px;height:20px}
.regeln-liste{list-style:none;padding:0;margin:.4rem 0} .regeln-liste li{padding:.2rem 0}
.beleg-upload .button{cursor:pointer}
kbd{font:inherit;font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .4em;background:var(--card2)}
code{font-size:.88em;background:var(--card2);color:var(--orange);padding:.08em .35em;border-radius:5px;word-break:break-all}
details summary{cursor:pointer;margin:.6rem 0}
.spinner{display:inline-block;width:1em;height:1em;border:2px solid var(--line);border-top-color:var(--orange);border-radius:50%;animation:dreh .8s linear infinite;vertical-align:middle}
.htmx-indicator{display:none} .htmx-request .htmx-indicator,.htmx-request.htmx-indicator{display:inline-block}
@keyframes dreh{to{transform:rotate(360deg)}}
footer{color:var(--muted);font-size:.78em;padding:1.4rem 0 0}
/* Semantik: Plus grün, neutral gelb, Minus rot */
.plus{color:var(--gruen)} .neutral{color:var(--gelb)} .minus{color:var(--rot)}
/* Diagramme */
.chart-karte{padding:1rem 1.2rem 1.2rem}
.chart-wrap{position:relative;width:100%}
.chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.chart-wrap svg .grid{stroke:var(--line);stroke-width:1}
.chart-wrap svg .achse{stroke:var(--muted);stroke-width:1}
.chart-wrap svg .tick{fill:var(--muted);font-size:12px;font-family:inherit}
.chart-wrap svg .label{fill:var(--fg);font-size:14px;font-weight:600;font-family:inherit}
.chart-wrap svg .wert{fill:var(--fg);font-size:12px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums}
.chart-wrap svg .hero{fill:var(--fg);font-size:22px;font-weight:800;font-family:inherit}
.legende{display:flex;gap:1.2rem;flex-wrap:wrap;margin:0 0 .6rem;font-size:.9em;color:var(--muted)}
.legende span{display:inline-flex;align-items:center;gap:.4rem} .legende i{width:12px;height:12px;border-radius:3px;display:inline-block} .legende b{color:var(--fg);font-variant-numeric:tabular-nums}
.tooltip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;font-size:.85em;box-shadow:var(--schatten);white-space:nowrap;z-index:3;line-height:1.5}
.tooltip i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:.35rem}
</style>

    <button data-ansicht="manuell" data-titel="Buchung erfassen" hx-get="/ui/manuell" hx-target="#main"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg><span class="txt">Buchung erfassen</span></button>
    <button data-ansicht="einstellungen" data-titel="Einstellungen" hx-get="/ui/einstellungen" hx-target="#main"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span class="txt">Einstellungen</span></button>

  <div class="unten">
    <button id="theme-toggle" type="button" title="Hell/Dunkel umschalten">🌙 <span class="txt">Dark</span></button>
    <div class="user"><div class="avatar">🦊</div><div class="user-txt"><b>Steuerfuchs</b><span class="rolle">§19 · EÜR</span> <span class="muted klein" title="Build">__VERSION__</span></div></div>
  </div>
</aside>
<header class="top">
  <h1 id="titel">Belege prüfen</h1>
  <div class="rechts">
    <label class="jahr-wahl" title="Steuerjahr – gilt für alle Ansichten">Jahr <select id="jahr-select"></select></label>
    <a id="ki-status" class="ki-badge" href="#" hx-get="/ui/einstellungen" hx-target="#main" title="Lokale KI (Ollama)"><span class="punkt"></span><span class="txt">KI</span></a>
    <span class="zusicherung">offline · lokal</span>
  </div>
</header>
<main id="main" hx-history="false"><p class="muted">Lade…</p></main>
<button id="nach-oben" type="button" title="Nach oben" aria-label="Nach oben"><svg viewBox="0 0 24 24"><path d="M12 19V5m-7 7l7-7 7 7"/></svg></button>
<script>
(function(){
  const nav = document.getElementById('nav'), titel = document.getElementById('titel');
  function markiere(url){
    const ansicht = (url.match(/\/ui\/([a-z]+)/) || [])[1];
    nav.querySelectorAll('button').forEach(b => { const an = b.dataset.ansicht === ansicht; b.classList.toggle('aktiv', an); if (an) titel.textContent = b.dataset.titel; });
  }
  document.body.addEventListener('htmx:afterRequest', e => {
    const p = e.detail.pathInfo && e.detail.pathInfo.requestPath || '';
    if (p.startsWith('/ui/')) markiere(p);
    zaehler();
  });
  // Globales Steuerjahr: hängt an jeder HTMX-Anfrage als Parameter „jahr“
  const jahrSel = document.getElementById('jahr-select');
  function jahr(){ return jahrSel.value; }
  document.body.addEventListener('htmx:configRequest', e => { if (jahr() && !('jahr' in e.detail.parameters)) e.detail.parameters.jahr = jahr(); });
  jahrSel.addEventListener('change', () => { try { localStorage.setItem('jahr', jahr()); } catch(e) {} const b = nav.querySelector('button.aktiv'); if (b) b.click(); zaehler(); });
  function jahreFuellen(jahre, standard){
    let gew = jahrSel.value; try { gew = gew || localStorage.getItem('jahr') || ''; } catch(e) {}
    if (!jahre.includes(+gew)) gew = String(standard);
    jahrSel.innerHTML = jahre.map(j => `<option value="${j}" ${String(j) === String(gew) ? 'selected' : ''}>${j}</option>`).join('');
  }
  async function zaehler(){
    try {
      const r = await fetch('/api/status' + (jahr() ? '?jahr=' + jahr() : '')); const s = await r.json();
      jahreFuellen(s.jahre, s.standardjahr);
      document.getElementById('z-vorschlaege').textContent = s.vorschlaege || '';
      document.getElementById('z-offen').textContent = s.offen_gesamt || '';
      const za = document.getElementById('z-abschluss'); za.textContent = s.jahresabschluss.erledigt + '/' + s.jahresabschluss.gesamt;
      za.classList.toggle('fertig', s.jahresabschluss.erledigt === s.jahresabschluss.gesamt);
      const k = document.getElementById('ki-status');
      k.className = 'ki-badge ' + s.ki;
      k.querySelector('.txt').textContent = {aktiv: 'KI aktiv', aus: 'KI aus', nicht_erreichbar: 'KI nicht erreichbar'}[s.ki] || 'KI';
      k.title = {aktiv: 'Ollama antwortet – Stufe 3/4 aktiv.', aus: 'KI-Stufen bewusst deaktiviert (Import-Seite).', nicht_erreichbar: 'Ollama antwortet nicht – Stufe 3/4 übersprungen, Regeln laufen weiter.'}[s.ki] || '';
    } catch(e) {}
  }
  document.addEventListener('zaehler-aktualisieren', zaehler);
  document.addEventListener('keydown', e => {
    if (e.target.matches('input,select,textarea')) return;
    const map = {'1':'import','2':'pruefen','3':'abgleich','4':'quartale','5':'auswertung','6':'offen','7':'jahresabschluss','8':'export'};
    if (map[e.key]) { const b = nav.querySelector('[data-ansicht="'+map[e.key]+'"]'); if (b) b.click(); }
  });
  const nachOben = document.getElementById('nach-oben');
  window.addEventListener('scroll', () => nachOben.classList.toggle('sichtbar', window.scrollY > 400), {passive: true});
  nachOben.addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));
  const tg = document.getElementById('theme-toggle');
  function aktuellesTheme(){ return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; }
  function themeAnzeigen(){ tg.innerHTML = aktuellesTheme() === 'dark' ? '☀️ <span class="txt">Hell</span>' : '🌙 <span class="txt">Dark</span>'; }
  tg.addEventListener('click', () => {
    const neu = aktuellesTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = neu;
    try { localStorage.setItem('theme', neu); } catch(e) {}
    themeAnzeigen();
  });
  themeAnzeigen();
  zaehler().then(() => htmx.ajax('GET', '/ui/pruefen', '#main').then(() => markiere('/ui/pruefen')));
})();
</script>
</body>
</html>
